name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/upc-pre-202620-1asi0238-13980-healthify/guardian-plus-platform

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.VM_HOST }}/swagger-ui/index.html
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload stack files
        run: scp deploy/compose.yaml deploy/Caddyfile "${{ vars.VM_USER }}@${{ vars.VM_HOST }}:~/guardian-plus/"

      - name: Pull and restart
        run: |
          ssh "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" \
            "GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' GHCR_USER='${{ github.actor }}' IMAGE_TAG='${{ github.sha }}' bash -s" <<'EOF'
          set -euo pipefail
          cd ~/guardian-plus
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull
          docker logout ghcr.io
          docker compose up -d --remove-orphans
          docker image prune -f
          EOF

      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.VM_HOST }}/v3/api-docs" > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 10
          done
          echo "The API did not come up in time" >&2
          exit 1
