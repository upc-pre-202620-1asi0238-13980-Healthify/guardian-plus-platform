services:
  postgres:
    image: postgres:17
    container_name: guardian-plus-postgres
    environment:
      POSTGRES_DB: guardian_plus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - guardian-plus-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: guardian-plus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  guardian-plus-data: