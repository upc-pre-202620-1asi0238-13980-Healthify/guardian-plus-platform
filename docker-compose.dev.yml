services:
  postgres:
    image: postgres:17
    container_name: guardian-plus-postgres
    environment:
      POSTGRES_DB: guardian_plus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - guardian-plus-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: guardian-plus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: guardian-plus-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  guardian-plus-data: