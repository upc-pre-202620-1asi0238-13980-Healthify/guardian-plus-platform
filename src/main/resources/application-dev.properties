# Development profile
spring.datasource.url=jdbc:postgresql://${DATABASE_URL:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:guardian_plus}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Developer-friendly JPA behavior
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# App port
server.port=${PORT:8080}
# Emergency & Alerting: allow triggering any alert source through the API to demo flows whose bounded context is not built yet
emergency-alerting.api.allow-any-alert-source=true
# Health Monitoring: consume the vital sign telemetry from the local broker (docker-compose.dev.yml) without extra setup
health-monitoring.telemetry.mqtt.enabled=${HEALTH_MONITORING_MQTT_ENABLED:true}
