spring.application.name=guardian-plus-platform

# Default to development when no explicit profile is provided
spring.profiles.default=${SPRING_PROFILES_ACTIVE:dev}

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.healthify.guardian.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Flush updates in a consistent order (by entity type and id) so concurrent transactions touching
# the same rows always lock them in the same order and cannot deadlock each other
spring.jpa.properties.hibernate.order_updates=true

# Application Information for Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Without this, Spring's MessageSource (used for @Valid bean-validation messages) silently falls
# back to the JVM's platform default locale before trying the base bundle, exactly like the
# java.util.ResourceBundle pitfall worked around in MessageResolver.
spring.messages.fallback-to-system-locale=false

# Flyway Configuration
spring.flyway.enabled=false

# Care Routines & Wellness bounded context
# Timezone used to evaluate the sleep window against reminder issuance times
care-routines-wellness.zone-id=America/Lima
# Platform-wide default sleep window (per-person-under-care configuration is a future Profile integration)
care-routines-wellness.sleep-window.start=22:00
care-routines-wellness.sleep-window.end=06:00
# Tolerance before an issued medication reminder is reissued (ReminderReissuePolicy, "10 min" business rule)
care-routines-wellness.reminder.reissue-tolerance-minutes=10
# Scheduler cadences
care-routines-wellness.reminder.scheduler.due-check-delay-ms=30000
care-routines-wellness.reminder.scheduler.reissue-check-delay-ms=60000
# Medication stock policy (MedicationStockPolicy, "3 day" business rule) and defaults
care-routines-wellness.medication-stock.restock-threshold-days=3
care-routines-wellness.medication-stock.default-daily-consumption=1
care-routines-wellness.medication-stock.doses-per-medication-confirmation=1
# Wearable device MQTT ingestion (disabled until the wearable simulator is wired up)
care-routines-wellness.wearable.mqtt.enabled=false
care-routines-wellness.wearable.mqtt.broker-url=tcp://localhost:1883
care-routines-wellness.wearable.mqtt.activity-topic=guardian-plus/wearable/activity
care-routines-wellness.wearable.mqtt.sleep-topic=guardian-plus/wearable/sleep
# Emergency & Alerting bounded context
# Scheduler cadences (the 20 s fall window and the acknowledgement timeout are domain policies, not settings)
emergency-alerting.scheduler.fall-confirmation-check-delay-ms=1000
emergency-alerting.scheduler.ack-timeout-check-delay-ms=5000
# Threads dedicated to sending notifications
emergency-alerting.notifications.executor.pool-size=4
# Only wearable signals (fall, SOS) may be triggered through POST /api/v1/alerts; other sources come from their bounded contexts
emergency-alerting.api.allow-any-alert-source=false
